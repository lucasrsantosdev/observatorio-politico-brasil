[project]
name = "observatorio-politico-brasil"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lucasrsantosdev", email = "lucascordeirorsantos@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "httpx>=0.28.1",
    "polars>=1.43.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
    "tenacity>=9.1.4",
]

[project.scripts]
observatorio-politico-brasil = "observatorio_politico_brasil:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]
